<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ManinhasBijou</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Poppins:wght@300;400;600&family=Pacifico&display=swap" rel="stylesheet">

<style>

:root {
  --azul-escuro: #194569;
  --azul: #5F84A2;
  --bg: #CADEED;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(to bottom, var(--bg), #fff);
  color: var(--azul-escuro);
}

/* HERO */
.hero {
  text-align: center;
  padding: 60px 20px;
}

.hero img {
  width: 150px;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  50% { transform: translateY(-10px); }
}

.hero p {
  font-family: 'Pacifico';
  color: var(--azul);
}

.hero::after {
  content: "✦ ✧ ✦";
  display: block;
  margin-top: 10px;
  color: #91AEC4;
  font-size: 18px;
}

.btn {
  display: inline-block;
  margin-top: 15px;
  background: var(--azul);
  color: white;
  padding: 12px 22px;
  border-radius: 25px;
  text-decoration: none;
  font-weight: 600;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  transition: 0.2s;
}

.btn:hover {
  transform: scale(1.05);
}

/* BANNER - CORRIGIDO */
.promo {
  overflow: hidden;
  background: var(--azul);
  color: white;
  padding: 8px 0;
  white-space: nowrap;
  position: relative;
}

.promo-track {
  display: inline-flex;
  gap: 200px;
  animation: slide 20s linear infinite;
}

@keyframes slide {
  0% {
    transform: translateX(0);
  }
  100% {
    transform: translateX(-50%);
  }
}

/* MAIS VENDIDOS */
.mais-vendidos {
  padding: 20px;
}

.scroll-vendidos {
  display: flex;
  gap: 15px;
  overflow-x: auto;
  padding-bottom: 10px;
}

.card-vendido {
  flex: 0 0 170px;
  background: white;
  border-radius: 15px;
  overflow: hidden;
  position: relative;
  cursor: pointer;
  opacity: 0;
  transform: translateY(30px);
  transition: 0.5s;
  display: flex;
  flex-direction: column;
}

.card-vendido.show {
  opacity: 1;
  transform: translateY(0);
}

.card-vendido img {
  width: 100%;
  height: 170px;
  object-fit: cover;  /* mantém proporção, corta se necessário */
}

.card-vendido p {
  text-align: center;
  margin: 8px 0 4px 0;
  padding: 0 5px;
  font-weight: 500;
  font-size: 14px;
}

.card-vendido .price {
  text-align: center;
  display: block;
  margin: 0 0 10px 0;
  padding: 0;
  color: var(--azul);
  font-size: 15px;
  font-weight: 600;
}

/* TAG */
.tag {
  position: absolute;
  top: 10px;
  left: 10px;
  background: var(--azul);
  color: white;
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 10px;
  z-index: 1;
}

/* BRILHO */
.card-vendido::after {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 50%;
  height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
  pointer-events: none;
}

.card-vendido:hover::after,
.card-vendido:active::after {
  animation: brilho 0.8s ease;
}

@keyframes brilho {
  100% { left: 150%; }
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 15px;
  padding: 20px;
}

@media (min-width:600px){
  .grid { grid-template-columns: repeat(3,1fr);}
}
@media (min-width:900px){
  .grid { grid-template-columns: repeat(4,1fr);}
}

.card {
  background: white;
  border-radius: 15px;
  overflow: hidden;
  text-align: center;
  cursor: pointer;
  opacity: 0;
  transform: translateY(30px);
  transition: 0.5s;
  display: flex;
  flex-direction: column;
}

.card.show {
  opacity: 1;
  transform: translateY(0);
}

.card img {
  width: 100%;
  /* VOLTEI AO TAMANHO ANTERIOR (mais quadrado/vertical) */
  height: auto;
  aspect-ratio: 3 / 4;
  object-fit: cover;
}

.card p {
  margin: 8px 0 4px 0;
  padding: 0 5px;
  font-weight: 500;
}

.card .price {
  display: block;
  margin: 0 0 12px 0;
  color: var(--azul);
  font-weight: 600;
  font-size: 14px;
}

/* MODAL */
.modal {
  position: fixed;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

.modal.active {
  display: flex;
}

.modal-content {
  background: white;
  border-radius: 20px;
  width: 90%;
  max-width: 400px;
  overflow: hidden;
  position: relative;
}

.modal img {
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
}

.modal-body {
  padding: 15px;
}

.whatsapp-btn {
  display: block;
  background: #25D366;
  color: white;
  padding: 14px;
  border-radius: 14px;
  text-align: center;
  font-weight: 700;
  margin-top: 10px;
  box-shadow: 0 5px 15px rgba(37,211,102,0.3);
  transition: 0.2s;
  text-decoration: none;
}

.whatsapp-btn:hover {
  transform: scale(1.05);
}

.close {
  position: absolute;
  right: 20px;
  top: 20px;
  background: rgba(0,0,0,0.6);
  color: white;
  font-size: 28px;
  cursor: pointer;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  z-index: 1001;
}

.close:hover {
  background: rgba(0,0,0,0.8);
}

</style>
</head>

<body>

<section class="hero">
  <img src="logomb.png" alt="Logo ManinhasBijou">
  <h1>ManinhasBijou</h1>
  <p>Feito com carinho 💙</p>
  <a href="#catalogo" class="btn">Ver catálogo</a>
</section>

<div class="promo">
  <div class="promo-track">
    <span>💙 Acima de R$50,00, você garante um brinde! ✨</span>
    <span>💙 Acima de R$50,00, você garante um brinde! ✨</span>
  </div>
</div>

<section class="mais-vendidos">
  <h2>⭐ Mais vendidos</h2>
  <div class="scroll-vendidos" id="maisVendidos"></div>
</section>

<section id="catalogo" class="grid"></section>

<!-- MODAL -->
<div id="modal" class="modal">
  <span class="close" onclick="fecharModal()">×</span>
  <div class="modal-content">
    <img id="modal-img" alt="Produto">
    <div class="modal-body">
      <h2 id="modal-title"></h2>
      <p id="modal-desc"></p>
      <p style="font-size:13px; opacity:0.7;">
        Envio rápido + atendimento personalizado 💙
      </p>
      <a id="whatsapp-link" class="whatsapp-btn" target="_blank">
        ✨ Comprar via WhatsApp
      </a>
    </div>
  </div>
</div>

<script>

const numero = "5511939615755";

// Array completo de produtos
const produtos = [
  {nome:"Colar Azul Celestial", tipo:"Colar", preco:"15,99", img:"img/colarazul.png", destaque:true},
  {nome:"Pulseira Drama", tipo:"Pulseira", preco:"11,90", img:"img/pulseiradrama.jpg", destaque:true},
  {nome:"Anel Coração Minimalista", tipo:"Anel", preco:"9,90", img:"img/anelcoracao.jpg", destaque:false},
  {nome:"Brinco Argola Pequena", tipo:"Brinco", preco:"12,50", img:"img/brincoargola.jpg", destaque:false},
  {nome:"Colar Pérola Fake", tipo:"Colar", preco:"18,90", img:"img/colarperola.jpg", destaque:false},
  {nome:"Tornozeleira Dourada", tipo:"Tornozeleira", preco:"14,90", img:"img/tornozeleira.jpg", destaque:false},
  {nome:"Pulseira Corrente Macia", tipo:"Pulseira", preco:"10,90", img:"img/pulseiracorrente.jpg", destaque:true},
  {nome:"Anel Ajustável Folheado", tipo:"Anel", preco:"8,90", img:"img/anelfolheado.jpg", destaque:false},
  {nome:"Brinco Estrela Cadente", tipo:"Brinco", preco:"16,90", img:"img/brincoestrela.jpg", destaque:false},
  {nome:"Colar Gota Azul", tipo:"Colar", preco:"22,90", img:"img/colargota.jpg", destaque:true}
];

function render(){
  const grid = document.getElementById("catalogo");
  grid.innerHTML = "";

  produtos.forEach(p => {
    grid.innerHTML += `
      <div class="card" onclick="abrirModal('${p.nome}','${p.tipo} - Peça única e delicada','${p.img}')">
        <img src="${p.img}" alt="${p.nome}" onerror="this.src='https://placehold.co/600x800?text=Imagem+Breve'">
        <p>${p.nome}</p>
        <span class="price">R$ ${p.preco}</span>
      </div>
    `;
  });

  animarEntrada();
}

function renderVendidos(){
  const area = document.getElementById("maisVendidos");
  area.innerHTML = "";

  const destaqueProdutos = produtos.filter(p => p.destaque === true);
  
  destaqueProdutos.forEach(p => {
    area.innerHTML += `
      <div class="card-vendido" onclick="abrirModal('${p.nome}','${p.tipo} - Peça única e delicada','${p.img}')">
        <div class="tag">Mais vendido</div>
        <img src="${p.img}" alt="${p.nome}" onerror="this.src='https://placehold.co/600x800?text=Imagem+Breve'">
        <p>${p.nome}</p>
        <span class="price">R$ ${p.preco}</span>
      </div>
    `;
  });

  animarEntrada();
}

/* animação ao aparecer */
function animarEntrada(){
  const elementos = document.querySelectorAll('.card, .card-vendido');

  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        entry.target.classList.add('show');
      }
    });
  }, { threshold: 0.1 });

  elementos.forEach(el => observer.observe(el));
}

function abrirModal(nome, desc, img){
  const modal = document.getElementById("modal");
  modal.classList.add("active");
  
  document.getElementById("modal-title").innerText = nome;
  document.getElementById("modal-desc").innerText = desc;
  document.getElementById("modal-img").src = img;
  
  // Tratamento para imagem quebrada no modal
  const modalImg = document.getElementById("modal-img");
  modalImg.onerror = function() {
    this.src = 'https://placehold.co/600x800?text=Imagem+Breve';
  };

  const msg = `Oi! Tenho interesse nesse produto: ${nome} - ${desc}`;
  document.getElementById("whatsapp-link").href =
    `https://wa.me/${numero}?text=${encodeURIComponent(msg)}`;
}

function fecharModal(){
  document.getElementById("modal").classList.remove("active");
}

// Fechar modal ao clicar fora do conteúdo
window.onclick = function(event) {
  const modal = document.getElementById("modal");
  if (event.target === modal) {
    fecharModal();
  }
}

render();
renderVendidos();

</script>

</body>
</html>
