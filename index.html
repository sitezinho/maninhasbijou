<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ManinhasBijou</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Poppins:wght@300;400;600&family=Pacifico&display=swap" rel="stylesheet">

<style>

:root {
  --azul-escuro: #194569;
  --azul: #5F84A2;
  --bg: #CADEED;
}

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(to bottom, var(--bg), #fff);
  color: var(--azul-escuro);
}

/* HERO */
.hero {
  text-align: center;
  padding: 60px 20px;
}

.hero img {
  width: 120px;
  animation: float 3s ease-in-out infinite;
}

.hero h1 {
  font-family: 'Nunito';
}

.hero p {
  font-family: 'Pacifico';
  color: var(--azul);
}

.hero::after {
  content: "✦ ✧ ✦";
  display: block;
  margin-top: 10px;
  color: #91AEC4;
}

.btn {
  background: var(--azul);
  color: white;
  padding: 12px 20px;
  border-radius: 20px;
  text-decoration: none;
}

/* BANNER */
.promo {
  overflow: hidden;
  background: var(--azul);
  color: white;
  padding: 8px 0;
  font-size: 14px;
  white-space: nowrap;
  letter-spacing: 0.5px;
  font-weight: 500;
}

.promo-track {
  display: flex;
  gap: 300px;
  animation: slide 20s linear infinite;
}

.promo-track span {
  white-space: nowrap;
}

@keyframes slide {
  from { transform: translateX(0); }
  to { transform: translateX(-100%); }
}

@keyframes float {
  50% { transform: translateY(-10px);}
}

/* CATEGORIAS */
.categories {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 10px;
}

.categories button {
  background: white;
  border: none;
  padding: 10px 15px;
  border-radius: 20px;
  cursor: pointer;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 15px;
  padding: 30px 20px;
}

.card {
  background: white;
  border-radius: 15px;
  overflow: hidden;
  text-align: center;
  position: relative;
  box-shadow: 0 5px 10px rgba(0,0,0,0.05);
  cursor: pointer;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px) scale(1.03);
}

/* 🔥 AJUSTE PRINCIPAL DAS IMAGENS */
.card img {
  width: 100%;
  height: 150px; /* controla tamanho */
  object-fit: cover; /* corta sem distorcer */
  transition: 0.3s;
}

.card:hover img {
  transform: scale(1.05);
}

.card p {
  margin: 5px 0;
}

.price {
  color: var(--azul);
  font-size: 13px;
}

/* LIKE */
.like-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  background: white;
  border-radius: 50%;
  padding: 6px 8px;
  cursor: pointer;
}

.like-btn.liked {
  color: red;
}

/* MODAL */
.modal {
  position: fixed;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  display: none;
  justify-content: center;
  align-items: center;
}

.modal.active {
  display: flex;
}

.modal-content {
  background: white;
  border-radius: 20px;
  max-width: 400px;
  width: 90%;
  overflow: hidden;
}

.modal-content img {
  width: 100%;
}

.modal-body {
  padding: 15px;
}

.whatsapp-btn {
  display: block;
  background: #25D366;
  color: white;
  padding: 10px;
  border-radius: 10px;
  text-align: center;
  text-decoration: none;
}

.close {
  position: absolute;
  top: 20px;
  right: 20px;
  color: white;
  font-size: 20px;
  cursor: pointer;
}

</style>
</head>

<body>

<section class="hero">
  <img src="logomb.png">
  <h1>ManinhasBijou</h1>
  <p>Feito com carinho 💙</p>
  <a href="#catalogo" class="btn">Ver catálogo</a>
</section>

<div class="promo">
  <div class="promo-track">
    <span>💙 Acima de R$50,00, você garante um brinde! ✨</span>
    <span>💙 Acima de R$50,00, você garante um brinde! ✨</span>
    <span>💙 Acima de R$50,00, você garante um brinde! ✨</span>
    <span>💙 Acima de R$50,00, você garante um brinde! ✨</span>
  </div>
</div>

<div class="categories">
  <button onclick="filtrar('todos')">Todos</button>
  <button onclick="filtrar('Pulseira')">Pulseiras</button>
  <button onclick="filtrar('Colar')">Colares</button>
  <button onclick="mostrarFavoritos()">Meus fav ❤️</button>
</div>

<section id="catalogo" class="grid"></section>

<div id="modal" class="modal">
  <span class="close" onclick="fecharModal()">×</span>
  <div class="modal-content">
    <img id="modal-img">
    <div class="modal-body">
      <h2 id="modal-title"></h2>
      <p id="modal-desc"></p>
      <a id="whatsapp-link" class="whatsapp-btn" target="_blank">Pedir pelo WhatsApp</a>
    </div>
  </div>
</div>

<script>

const numero = "5511939615755";

const produtos = [
  {nome:"Colar Azul", tipo:"Colar", preco:"15,99", img:"img/colarazul.png"},
  {nome:"Pulseira Drama", tipo:"Pulseira", preco:"11,90", img:"img/pulseiradrama.jpg"}
];

let curtidos = JSON.parse(localStorage.getItem("curtidos")) || [];

function render(lista){
  const grid = document.getElementById("catalogo");
  grid.innerHTML = "";

  lista.forEach(p => {
    const liked = curtidos.includes(p.nome);

    grid.innerHTML += `
      <div class="card" onclick="abrirModal('${p.nome}','${p.tipo}','${p.img}')">
        <div class="like-btn ${liked ? 'liked':''}" onclick="curtir(event,'${p.nome}')">
          ${liked ? '❤️':'♡'}
        </div>
        <img src="${p.img}">
        <p>${p.nome}</p>
        <span class="price">R$ ${p.preco}</span>
      </div>
    `;
  });
}

function filtrar(tipo){
  if(tipo==="todos") return render(produtos);
  render(produtos.filter(p=>p.tipo===tipo));
}

function mostrarFavoritos(){
  render(produtos.filter(p=>curtidos.includes(p.nome)));
}

function curtir(e,nome){
  e.stopPropagation();

  if(curtidos.includes(nome)){
    curtidos = curtidos.filter(i=>i!==nome);
  } else {
    curtidos.push(nome);
  }

  localStorage.setItem("curtidos",JSON.stringify(curtidos));
  render(produtos);
  if(curtidos.length>=3) sugerir();
}

function sugerir(){
  if(confirm("Você já tem vários favoritos 💙 Quer finalizar no WhatsApp?")){
    let msg="Oi! Quero esses itens:\n\n";
    curtidos.forEach(i=>msg+="• "+i+"\n");
    window.open(`https://wa.me/${numero}?text=${encodeURIComponent(msg)}`);
  }
}

function abrirModal(nome,desc,img){
  document.getElementById("modal").classList.add("active");
  document.getElementById("modal-title").innerText = nome;
  document.getElementById("modal-desc").innerText = desc;
  document.getElementById("modal-img").src = img;

  const msg=`Oi! Quero esse produto: ${nome}`;
  document.getElementById("whatsapp-link").href =
    `https://wa.me/${numero}?text=${encodeURIComponent(msg)}`;
}

function fecharModal(){
  document.getElementById("modal").classList.remove("active");
}

render(produtos);

</script>

</body>
</html>
